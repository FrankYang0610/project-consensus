<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="300" role="img" aria-label="polyu.life red wordmark">
  <title>polyu.life</title>
  <defs>
    <style>
      :root { --brand-red:#C0142A; } /* 主红色，可按需调整 */
      text{
        font-family: "Lucida Grande","Lucida Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        font-weight: 800;
        letter-spacing: 1.1px;
        font-kerning: normal;
        font-variant-ligatures: contextual;
      }
    </style>
  </defs>

  <!-- 文字：polyu 斜体，.life 常规 -->
  <text x="50%" y="50%" font-size="96" text-anchor="middle" dominant-baseline="middle" fill="var(--brand-red)">
    <tspan font-style="italic">polyu</tspan><tspan>.life</tspan>
  </text>

  <!-- 渐收下划线（左粗右细），用封闭形状实现可变“笔画”粗细 -->
  <!-- 左端厚度约 10px，右端约 4px，可微调下面坐标差值控制 -->
  <path d="M150 114 Q300 130 450 116 L450 120 Q300 138 150 124 Z"
        fill="var(--brand-red)"/>
</svg>