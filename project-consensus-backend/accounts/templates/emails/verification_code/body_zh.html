<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证码邮件</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f5f5f5;">
    <table role="presentation" style="width: 100%; border-collapse: collapse;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table role="presentation" style="width: 600px; max-width: 100%; border-collapse: collapse; background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <!-- Header -->
                    <tr>
                        <td style="padding: 40px 40px 30px 40px; text-align: center; border-bottom: 1px solid #e5e7eb;">
                            <h1 style="margin: 0; font-size: 24px; font-weight: 600; color: #111827;">PolyU Life</h1>
                        </td>
                    </tr>
                    
                    <!-- Content -->
                    <tr>
                        <td style="padding: 40px;">
                            <h2 style="margin: 0 0 20px 0; font-size: 20px; font-weight: 600; color: #111827;">验证您的账户</h2>
                            
                            <p style="margin: 0 0 20px 0; font-size: 16px; line-height: 1.5; color: #374151;">
                                您好，感谢使用 PolyU Life！
                            </p>
                            
                            <p style="margin: 0 0 30px 0; font-size: 16px; line-height: 1.5; color: #374151;">
                                您的验证码是：
                            </p>
                            
                            <!-- Verification Code Box -->
                            <div style="background-color: #f3f4f6; border-radius: 8px; padding: 24px; text-align: center; margin: 0 0 30px 0;">
                                <span style="font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #2563eb; font-family: 'Courier New', monospace;">{{ code }}</span>
                            </div>
                            
                            <p style="margin: 0 0 20px 0; font-size: 14px; line-height: 1.5; color: #6b7280;">
                                此验证码将在 <strong>{{ ttl_minutes }} 分钟</strong>内有效。请勿将验证码透露给他人。
                            </p>
                            
                            <p style="margin: 0 0 20px 0; font-size: 14px; line-height: 1.5; color: #6b7280;">
                                如果这不是您本人的操作，请忽略此邮件，您的账户安全不会受到影响。
                            </p>
                        </td>
                    </tr>
                    
                    <!-- Footer -->
                    <tr>
                        <td style="padding: 30px 40px; background-color: #f9fafb; border-top: 1px solid #e5e7eb; border-radius: 0 0 8px 8px;">
                            <p style="margin: 0 0 10px 0; font-size: 14px; color: #6b7280; text-align: center;">
                                需要帮助？访问我们的 <a href="https://polyu.life/help" style="color: #2563eb; text-decoration: none;">帮助中心</a>
                            </p>
                            <p style="margin: 0; font-size: 12px; color: #9ca3af; text-align: center;">
                                &copy; 2026 PolyU Life. 保留所有权利。
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
